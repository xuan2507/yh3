<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
    <title>Reset Password - LearnAI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mascot.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/enhancements.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="auth-logo">
                <i class="fas fa-brain"></i>
                <span>LearnAI</span>
            </a>
            <h1>Reset Password</h1>
            <p class="auth-subtitle">Enter your email and we'll send you reset instructions</p>
            
            <form class="auth-form" id="forgotForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-full btn-lg" id="resetBtn">
                    Send Reset Link
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
            
            <p class="auth-switch">
                <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Sign In</a>
            </p>
        </div>
        
        <div class="auth-image">
            <div class="auth-image-content">
                <h2>Don't Worry</h2>
                <p>We'll help you get back into your account quickly.</p>
                <div class="auth-features">
                    <div class="auth-feature">
                        <i class="fas fa-check-circle"></i>
                        <span>Secure password reset</span>
                    </div>
                    <div class="auth-feature">
                        <i class="fas fa-check-circle"></i>
                        <span>Link expires in 1 hour</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/ui-utils.js" defer></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('forgotForm');
        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                if (!email) {
                    UI.toast('Please enter your email.', 'warning');
                    return;
                }
                UI.setLoading(form, true);
                setTimeout(() => {
                    UI.setLoading(form, false);
                    UI.toast('Reset link sent! Check your email.', 'success');
                    document.getElementById('email').value = '';
                }, 1500);
            });
        }
    });
    </script>
</body>
</html>
