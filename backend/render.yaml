services:
  - type: web
    name: learnai-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:init
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: learnai-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://xuan2507.github.io

databases:
  - name: learnai-db
    plan: free
    ipAllowList: []
