<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
    <title>Focus Mode - LearnAI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/focus.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="focus-page">
    <div class="focus-bg"></div>
    <div class="focus-exit">
        <a href="dashboard.html"><i class="fas fa-arrow-left"></i> Exit Focus</a>
    </div>

    <div class="focus-container">
        <h1 class="focus-title">Focus Mode</h1>
        <p class="focus-subtitle">Eliminate distractions. One task at a time.</p>

        <div class="focus-task">
            <input type="text" id="focusTask" placeholder="What are you working on?">
        </div>

        <div class="focus-timer" id="focusTimer">25:00</div>

        <div class="focus-presets">
            <button class="focus-preset active" data-min="25">Pomodoro (25m)</button>
            <button class="focus-preset" data-min="45">Deep (45m)</button>
            <button class="focus-preset" data-min="15">Quick (15m)</button>
            <button class="focus-preset" data-min="5">Break (5m)</button>
        </div>

        <div class="focus-controls">
            <button class="btn btn-primary btn-lg" id="focusStart"><i class="fas fa-play"></i> Start</button>
            <button class="btn btn-outline btn-lg" id="focusPause" style="display:none"><i class="fas fa-pause"></i> Pause</button>
            <button class="btn btn-outline btn-lg" id="focusReset"><i class="fas fa-redo"></i> Reset</button>
        </div>

        <div class="focus-stats">
            <div class="focus-stat">
                <div class="focus-stat-value" id="statSessions">0</div>
                <div class="focus-stat-label">Sessions</div>
            </div>
            <div class="focus-stat">
                <div class="focus-stat-value" id="statMinutes">0</div>
                <div class="focus-stat-label">Minutes</div>
            </div>
            <div class="focus-stat">
                <div class="focus-stat-value" id="statStreak">0</div>
                <div class="focus-stat-label">Streak</div>
            </div>
        </div>

        <div class="focus-sounds">
            <button class="sound-btn" data-sound="rain"><i class="fas fa-cloud-rain"></i> Rain</button>
            <button class="sound-btn" data-sound="fire"><i class="fas fa-fire"></i> Fire</button>
            <button class="sound-btn" data-sound="cafe"><i class="fas fa-coffee"></i> Cafe</button>
            <button class="sound-btn" data-sound="waves"><i class="fas fa-water"></i> Waves</button>
        </div>

        <p class="focus-quote" id="focusQuote">"The secret of getting ahead is getting started."</p>
    </div>

    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/focus.js"></script>
</body>
</html>
