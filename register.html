<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
    <title>Sign Up - LearnAI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mascot.css">
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="auth-logo">
                <i class="fas fa-brain"></i>
                <span>LearnAI</span>
            </a>
            <h1>Create Account</h1>
            <p class="auth-subtitle">Start your Cambridge & IELTS prep with AI</p>
            
            <form class="auth-form" id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="firstName" placeholder="John" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="lastName" placeholder="Doe" required>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="examType">Exam Type</label>
                    <div class="input-wrapper">
                        <i class="fas fa-graduation-cap"></i>
                        <select id="examType" required>
                            <option value="">Select your exam</option>
                            <option value="alevel">Cambridge A-Level</option>
                            <option value="igcse">Cambridge IGCSE</option>
                            <option value="ielts">IELTS</option>
                            <option value="multiple">Multiple</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Min 8 characters" required minlength="8">
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="checkbox-label terms-label">
                        <input type="checkbox" id="terms" required>
                        <span>I agree to the <a href="terms.html" target="_blank">Terms</a> and <a href="privacy.html" target="_blank">Privacy Policy</a></span>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary btn-full btn-lg" id="registerBtn">
                    Create Account
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
            
            <div class="auth-divider">
                <span>or</span>
            </div>
            
            <button class="btn btn-outline btn-full social-btn" id="googleSignUp">
                <i class="fab fa-google"></i>
                Continue with Google
            </button>
            
            <p class="auth-switch">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
        </div>
        
        <div class="auth-image">
            <div class="auth-image-content">
                <h2>Join 50,000+ Cambridge Students</h2>
                <p>Get instant access to AI-generated notes, past paper solutions, and personalized study plans.</p>
                <div class="auth-features">
                    <div class="auth-feature">
                        <i class="fas fa-check-circle"></i>
                        <span>Free plan with 5 uploads</span>
                    </div>
                    <div class="auth-feature">
                        <i class="fas fa-check-circle"></i>
                        <span>Pro unlocks all subjects</span>
                    </div>
                    <div class="auth-feature">
                        <i class="fas fa-check-circle"></i>
                        <span>Cancel anytime</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/mascot.js"></script>
</body>
</html>
